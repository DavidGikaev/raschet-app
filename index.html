<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Просрочка">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">

<title>Расчёт просрочки</title>
<style>:root {
  --bg: #f3f1ec; --card: #fffefa; --ink: #1c2421; --muted: #627068; --line: #dcd8ce;
  --accent: #1d4a3d; --accent-ink: #ffffff; --accent-soft: #e3ece6; --brass: #9a7421; --brass-soft: #f4ecd6;
  --danger: #9b2c2c; --danger-soft: #f8e4e1; --ok: #1d4a3d; --shadow: 0 1px 2px rgba(28,36,33,.06), 0 6px 18px -8px rgba(28,36,33,.12);
  --r: 12px; --nav-h: 62px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #121715; --card: #1b221f; --ink: #e8ece9; --muted: #98a7a0; --line: #2d3733;
  --accent: #6fbf9d; --accent-ink: #0e1512; --accent-soft: #22322b; --brass: #d4b15f; --brass-soft: #332c18;
  --danger: #e58a82; --danger-soft: #3a2220; --ok: #6fbf9d; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px -8px rgba(0,0,0,.5);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --card: #1b221f; --ink: #e8ece9; --muted: #98a7a0; --line: #2d3733;
    --accent: #6fbf9d; --accent-ink: #0e1512; --accent-soft: #22322b; --brass: #d4b15f; --brass-soft: #332c18;
    --danger: #e58a82; --danger-soft: #3a2220; --ok: #6fbf9d; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px -8px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
}
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1020px; margin: 0 auto; padding: 0 16px; }

/* шапка */
header.top { background: var(--accent); color: var(--accent-ink); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent-ink); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 15px; letter-spacing: -.5px; flex: none; }
header.top h1 { margin: 0; font-size: 18px; line-height: 1.15; font-weight: 700; }
header.top small { display: block; font-weight: 400; opacity: .78; font-size: 12.5px; margin-top: 2px; }
header.top .sp { flex: 1; }
.iconbtn { background: transparent; border: 1px solid color-mix(in srgb, var(--accent-ink) 35%, transparent); color: var(--accent-ink); border-radius: 9px; padding: 7px 10px; cursor: pointer; font-size: 14px; }
.iconbtn:hover { background: color-mix(in srgb, var(--accent-ink) 12%, transparent); }

/* навигация */
nav.tabs { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -6px 20px -12px rgba(0,0,0,.25); }
nav.tabs button { flex: 1; background: none; border: 0; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 11.5px; cursor: pointer; min-height: var(--nav-h); }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button.on { color: var(--accent); font-weight: 650; }
nav.tabs button.on::before { content: ""; position: absolute; }
@media (min-width: 820px) {
  body { padding-bottom: 40px; }
  nav.tabs { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); box-shadow: none; padding: 0; justify-content: center; }
  nav.tabs .inner { display: flex; width: 100%; max-width: 1020px; padding: 0 16px; }
  nav.tabs button { flex-direction: row; justify-content: center; gap: 8px; min-height: 48px; font-size: 14.5px; padding: 0 14px; border-bottom: 3px solid transparent; }
  nav.tabs button.on { border-bottom-color: var(--accent); }
}
nav.tabs .inner { display: flex; width: 100%; }

/* карточки и формы */
main { padding-top: 16px; }
.view { display: none; }
.view.on { display: block; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card > h2, .card-h { margin: 0 0 10px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card > h2 .hint, .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
.grid2, .grid3 { display: grid; gap: 10px 12px; grid-template-columns: 1fr; }
@media (min-width: 620px) { .grid2 { grid-template-columns: 1fr 1fr; } .grid3 { grid-template-columns: 1fr 1fr 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; letter-spacing: .01em; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; min-height: 44px; outline: none; font-size: 16px;
}
textarea { min-height: 110px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
input.num, input.money { text-align: right; font-variant-numeric: tabular-nums; }
.chk { display: flex; align-items: flex-start; gap: 9px; font-size: 14.5px; padding: 6px 0; cursor: pointer; }
.chk input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.chk small { display: block; color: var(--muted); font-size: 12.5px; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 9px; padding: 9px 13px; cursor: pointer; font-size: 14.5px; min-height: 40px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 5px 9px; min-height: 32px; font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.seg { display: flex; background: var(--accent-soft); border-radius: 11px; padding: 3px; gap: 3px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 9px 4px; cursor: pointer; font-size: 14px; color: var(--muted); font-weight: 600; min-height: 40px; }
.seg button.on { background: var(--card); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
details.more { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; }
details.more > summary { cursor: pointer; font-weight: 650; font-size: 14.5px; color: var(--accent); padding: 4px 0; list-style: none; }
details.more > summary::before { content: "▸ "; }
details.more[open] > summary::before { content: "▾ "; }
.ev { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; padding: 8px; background: var(--bg); border-radius: 9px; margin-bottom: 8px; }
.ev .full { grid-column: 1 / -1; }
@media (min-width: 620px) { .ev { grid-template-columns: 1fr 1fr 1.4fr auto; } .ev .full { grid-column: auto; } }
.debt { border-left: 4px solid var(--brass); }
.pill { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 9px; font-size: 12.5px; font-weight: 600; }

/* результат */
.hero { background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 16px 16px 14px; margin: 14px 0 12px; box-shadow: var(--shadow); }
.hero .lab { font-size: 13px; opacity: .8; }
.hero .val { font-size: 32px; font-weight: 800; letter-spacing: -.5px; line-height: 1.12; font-variant-numeric: tabular-nums; word-break: break-word; }
.hero .sub { font-size: 14px; opacity: .9; margin-top: 6px; }
.hero .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.hero .chip { background: color-mix(in srgb, var(--accent-ink) 16%, transparent); border-radius: 8px; padding: 4px 9px; font-size: 13px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.hint-box { background: var(--brass-soft); border: 1px solid color-mix(in srgb, var(--brass) 35%, transparent); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; border: 1px dashed var(--line); border-radius: var(--r); margin: 14px 0; }

/* отчёт (экран и печать) */
.rep h1 { font-size: 20px; margin: 0 0 4px; }
.rep-sub { color: var(--muted); margin-bottom: 12px; font-size: 14px; }
.rep h2 { font-size: 15.5px; margin: 18px 0 8px; padding-bottom: 5px; border-bottom: 2px solid var(--accent-soft); }
.rep p { margin: 6px 0; font-size: 14.5px; }
.rep p.note { color: var(--muted); font-size: 13px; }
.rep p.warn { background: var(--danger-soft); color: var(--danger); border-radius: 8px; padding: 8px 10px; font-weight: 600; font-size: 13.5px; }
.rep-list { margin: 6px 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); }
.rep-foot { margin-top: 14px; font-size: 12px; color: var(--muted); }
table.kv { border-collapse: collapse; width: 100%; margin: 6px 0 10px; font-size: 14px; }
table.kv th { text-align: left; width: 38%; font-weight: 600; color: var(--muted); padding: 5px 8px 5px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
table.kv td { padding: 5px 0; border-bottom: 1px solid var(--line); }
.tw { overflow-x: auto; margin: 6px -2px 10px; -webkit-overflow-scrolling: touch; }
table.grid { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.grid th { background: var(--accent-soft); color: var(--accent); text-align: left; padding: 7px 8px; font-weight: 700; font-size: 12.5px; position: sticky; top: 0; }
table.grid td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.grid .r { text-align: right; white-space: nowrap; }
table.grid tr.muted td { color: var(--muted); font-style: italic; background: color-mix(in srgb, var(--brass-soft) 60%, transparent); }
table.grid tfoot td { font-weight: 700; background: var(--accent-soft); }
table.grid tr.sum td { font-weight: 700; }

/* история и данные */
.item { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .t { font-weight: 650; }
.item .s { color: var(--muted); font-size: 13px; }
.cal { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
.mon { background: var(--bg); border-radius: 9px; padding: 8px; }
.mon b { display: block; font-size: 13px; margin-bottom: 4px; }
.mon .g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: 11px; text-align: center; }
.mon .g span { padding: 2px 0; border-radius: 4px; }
.mon .g .h { color: var(--muted); font-size: 10px; }
.mon .g .off { background: var(--danger-soft); color: var(--danger); font-weight: 650; }
.mon .g .wk { background: color-mix(in srgb, var(--accent-soft) 100%, transparent); color: var(--accent); font-weight: 650; box-shadow: inset 0 0 0 1px var(--accent); }
.legend { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; margin: 6px 0 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; max-width: 90vw; }
.toast.on { opacity: .96; }
.foot { color: var(--muted); font-size: 12.5px; text-align: center; padding: 18px 16px 6px; }

/* печать / PDF */
#printRoot { display: none; }
@media print {
  @page { size: A4; margin: 14mm; }
  html, body { background: #fff !important; }
  body > *:not(#printRoot) { display: none !important; }
  #printRoot { display: block !important; color: #000; font-family: "Times New Roman", Georgia, serif; }
  #printRoot .rep h1 { font-size: 16pt; }
  #printRoot .rep-sub, #printRoot .rep p.note, #printRoot .rep-list, #printRoot .rep-foot { color: #333; }
  #printRoot .rep h2 { font-size: 12pt; border-bottom: 1px solid #000; color: #000; }
  #printRoot table.grid { min-width: 0; font-size: 8.6pt; }
  #printRoot table.grid th { background: #e8e8e8 !important; color: #000; position: static; border: 1px solid #777; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #printRoot table.grid td { border: 1px solid #999; color: #000; }
  #printRoot table.grid tfoot td { background: #f0f0f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #printRoot table.grid tr.muted td { background: #f6f6f6 !important; color: #444; }
  #printRoot table.kv th, #printRoot table.kv td { border-bottom: 1px solid #aaa; color: #000; }
  #printRoot .rep p.warn { background: none; border: 1px solid #000; color: #000; }
  #printRoot tr { page-break-inside: avoid; }
  #printRoot h2 { page-break-after: avoid; }
}
</style>
</head>

        : [r.from === r.to ? D(r.from) : D(r.from) + ' – ' + D(r.to), String(r.days), r.bal == null ? '' : M(r.bal), rateStr(r, cfg), formula(r, cfg), M(r.amount)]);

      blocks.push({ t: 'table', head: ['Период', 'Дней', 'Сумма долга, ₽', 'Ставка', 'Расчёт', what + ', ₽'], align: ['l', 'r', 'r', 'l', 'l', 'r'], rows, foot: ['Итого', String(accr), '', '', '', M(d.sum)] });
    });
    return blocks;
  }
  function overlapWarn(st, debts, end) {
    const out = [];
    DATA.MORATORIA.forEach(m => {
      if (st.mor && st.mor[m.id]) return;
      const a = E.fromISO(m.from), b = E.fromISO(m.to);
      const hit = debts.some(d => d.due != null && (d.end != null ? d.end : end) != null && d.due < b && (d.end != null ? d.end : end) >= a);
      if (hit) out.push('Период пересекается с мораторием «' + m.label + '» (' + D(a) + ' – ' + D(b) + '). Если он применим к должнику, отметьте его ниже — расчёт изменится.');
    });
    return out;
  }
  const endOf = st => E.fromISO(st.end);
  function checkInput(st) {
    const debts = App.toCfgDebts(st);
    const end = endOf(st);
    if (!debts.some(d => d.due != null)) return { empty: 'Укажите срок исполнения обязательства — расчёт появится сразу.' };
    if (end == null && !debts.some(d => d.end != null)) return { empty: 'Укажите дату, по которую нужно рассчитать.' };
    return { debts, end };
  }

  function penCfg(st) {
    const base = { firstDay: st.firstDay, inclusive: st.inclusive, vat: vatOf(st), excl: App.exclFromState(st) };
    const k = st.kind;
    let tiers = null;
    const main = k === 'pct' ? st.pct : k === 'fixed' ? st.fixed : k === 'annual' ? st.annual : null;
    if (main != null || st.tiers.length) {
      tiers = [{ from: 1, val: main || 0 }].concat(st.tiers.filter(t => t.from > 1 && t.val != null).map(t => ({ from: Math.round(t.from), val: t.val })));
    }
    const cfg = Object.assign({ mode: k, mult: st.mult || 1, divisor: st.divisor || 300, keyDateMode: st.keyDateMode, keyDate: E.fromISO(st.keyDate), tiers: (k === 'pct' || k === 'fixed' || k === 'annual') ? tiers : null }, base);
    return cfg;
  }
  function kindText(st) {
    const k = st.kind;
    if (k === 'pct') return E.fmtRate(st.pct || 0) + '% от суммы за каждый день' + (st.tiers.length ? ' (со ступенями)' : '');
    if (k === 'fixed') return M(st.fixed || 0) + ' ₽ за каждый день' + (st.tiers.length ? ' (со ступенями)' : '');
    if (k === 'annual') return E.fmtRate(st.annual || 0) + '% годовых';
    if (k === 'key') return 'ключевая ставка ЦБ × ' + E.fmtRate(st.mult || 1) + ' (годовых)';
    return '1/' + (st.divisor || 300) + (st.mult && st.mult !== 1 ? ' × ' + st.mult : '') + ' ключевой ставки ЦБ в день (' + (st.keyDateMode === 'each' ? 'по периодам её действия' : st.keyDateMode === 'end' ? 'на дату окончания' : 'на ' + D(E.fromISO(st.keyDate))) + ')';
  }

  function calcPen(st) {
    const inp = checkInput(st); if (inp.empty) return inp;
    const cfg = penCfg(st);
    if (cfg.mode === 'pct' && !(cfg.tiers && cfg.tiers[0].val > 0)) return { empty: 'Укажите ставку неустойки.' };
    if (cfg.mode === 'fixed' && !(cfg.tiers && cfg.tiers[0].val > 0)) return { empty: 'Укажите сумму неустойки за день.' };
    if (cfg.mode === 'annual' && !(cfg.tiers && cfg.tiers[0].val > 0)) return { empty: 'Укажите ставку, % годовых.' };
    if (cfg.mode !== 'fixed' && !st.debts.some(d => d.amount > 0)) return { empty: 'Укажите сумму, от которой начисляется неустойка.' };
    cfg.debts = inp.debts; cfg.end = inp.end;
    const res = E.calcDebts(cfg, App.rates());
    const fin = E.finalizePenalty(res, { cap: st.cap.mode === 'none' ? null : { mode: st.cap.mode, value: st.cap.value, ref: st.cap.ref, withFine: st.cap.withFine }, fine: st.fine });
    const warnings = res.warnings.concat(overlapWarn(st, inp.debts, inp.end));
    const blocks = [{ t: 'kv', rows: [['Основание', st.title || '—'], ['Условие о неустойке', kindText(st)], ['Расчёт по дату', inp.end != null ? D(inp.end) + (st.inclusive ? ' (включительно)' : ' (не включая)') : 'по датам обязательств'], ['Налог', vatText(st)]] }];
    const exInfo = App.exclFromState(st);
    if (exInfo.length) blocks.push({ t: 'kv', rows: exInfo.map(x => ['Не начисляется', D(x.from) + ' – ' + D(x.to) + ' — ' + x.label]) });
    blocks.push.apply(blocks, debtBlocks(res, cfg, 'Неустойка'));
    const sum = [['Неустойка по расчёту', M(res.total) + ' ₽']];
    if (fin.capApplied) sum.push(['Ограничение (лимит)', st.cap.mode === 'pctDebt' ? st.cap.value + '% от суммы каждого обязательства' : fin.cap != null ? M(fin.cap) + ' ₽' : '']), sum.push(['Неустойка с учётом лимита', M(fin.penaltyAfterCap) + ' ₽']);
    if (fin.fine > 0) sum.push(['Штраф', M(fin.fine) + ' ₽']);
    sum.push(['Итого', M(fin.final) + ' ₽']);
    blocks.push({ t: 'h', text: 'Итог' }, { t: 'kv', rows: sum });
    let reduced = null;
    if (st.red.on) {
      const r = st.red;
      const floor = E.calcDebts(Object.assign({}, cfg, { mode: 'key', mult: 1, tiers: null }), App.rates()).total;
      let rv = null, how = '';
      if (r.mode === 'mult' && r.mult > 0) { rv = E.calcDebts(Object.assign({}, cfg, { mode: 'key', mult: r.mult, tiers: null }), App.rates()).total; how = 'ключевая ставка × ' + E.fmtRate(r.mult); }
      else if (r.mode === 'annual' && r.annual > 0) { rv = E.calcDebts(Object.assign({}, cfg, { mode: 'annual', tiers: [{ from: 1, val: r.annual }] }), App.rates()).total; how = E.fmtRate(r.annual) + '% годовых'; }
      else if (r.mode === 'perDay' && r.perDay > 0) { rv = E.calcDebts(Object.assign({}, cfg, { mode: 'pct', tiers: [{ from: 1, val: r.perDay }] }), App.rates()).total; how = E.fmtRate(r.perDay) + '% в день'; }
      else if (r.mode === 'sum' && r.sum >= 0 && r.sum != null) { rv = r.sum; how = 'заданная сумма'; }
      if (rv != null) {
        reduced = rv;
        const base = fin.penaltyAfterCap;
        const rows = [['Неустойка по договору', M(base) + ' ₽'], ['Сниженная неустойка (' + how + ')', M(rv) + ' ₽'], ['Нижний предел — проценты по ст. 395 ГК РФ (ключевая ставка)', M(floor) + ' ₽'], ['Размер снижения', M(Math.max(0, base - rv)) + ' ₽ (' + (base > 0 ? E.fmtRate(Math.round((base - rv) / base * 1000) / 10) : '0') + '%)']];
        blocks.push({ t: 'h', text: 'Снижение неустойки по ст. 333 ГК РФ' }, { t: 'kv', rows });
        if (rv < floor - 0.005) { const w = 'Сниженная неустойка меньше процентов по ст. 395 ГК РФ — для обязательств, связанных с предпринимательской деятельностью, снижение ниже этого предела, как правило, недопустимо (п. 6 ст. 395 ГК РФ; разъяснения ВС РФ).'; blocks.push({ t: 'warn', text: w }); warnings.push(w); }
        if (rv > base) blocks.push({ t: 'note', text: 'Сниженный размер превышает неустойку по договору — снижение не требуется.' });
      } else blocks.push({ t: 'h', text: 'Снижение по ст. 333 ГК РФ' }, { t: 'p', text: 'Укажите параметры снижения.' });
    }
    warnings.forEach(w => { if (!/ст\. 395 ГК РФ — для обязательств/.test(w)) blocks.push({ t: 'note', text: w }); });
    const model = { title: 'Расчёт договорной неустойки', sub: st.title || '', blocks, footer: (st.kind === 'key' || st.kind === 'keyfrac' ? asOf() + ' ' : '') + stamp() };
    const chips = ['дней начисления: ' + res.accrDays];
    if (res.exclDays) chips.push('не начисляется: ' + res.exclDays + ' дн.');
    if (fin.capApplied) chips.push('применён лимит');
    if (reduced != null) chips.push('после ст. 333: ' + M(reduced) + ' ₽');
    const title = (st.title || 'Неустойка') + ' — ' + M(fin.final) + ' ₽';
    return {
      hero: { label: 'К взысканию (неустойка' + (fin.fine > 0 ? ' и штраф' : '') + ')', value: M(fin.final) + ' ₽', chips },
      warnings, model, file: 'Неустойка_' + (st.title || '').slice(0, 30),
      save: () => App.saveHistory('pen', title, 'по ' + (inp.end != null ? D(inp.end) : '—') + ', ' + kindText(st), st)
    };
  }

  /* =============== 3. СТ. 395 / 317.1 =============== */

        st.rateSrc === 'annual' ? field('Ставка по договору, % годовых', App.numInput(st, 'annual', recalc, '12')) : h('span')),

        field('Описание расчёта (для отчёта)', App.textInput(st, 'title', recalc, 'напр. Взыскание по акту № 5'))),
      App.debtsEditor(st, recalc, { title: 'Долг', amount: 'Сумма долга, ₽', amountHint: 'Основной долг, на который начисляются проценты', due: st.kind === '395' ? 'Последний день срока оплаты' : 'Дата, с которой начисляются проценты (последний день срока)', pay: 'Оплата части долга', add: 'Увеличение долга' }),

  function calcInt(st) {
    const inp = checkInput(st); if (inp.empty) return inp;
    if (!st.debts.some(d => d.amount > 0)) return { empty: 'Укажите сумму долга.' };
    const is395 = st.kind === '395';
    const stx = is395 ? st : Object.assign({}, st, { mor: {} });
    const cfg = { firstDay: st.firstDay, inclusive: st.inclusive, vat: vatOf(st), excl: App.exclFromState(stx), debts: inp.debts, end: inp.end };
    if (!is395 && st.rateSrc === 'annual') { if (!(st.annual > 0)) return { empty: 'Укажите ставку по договору.' }; cfg.mode = 'annual'; cfg.tiers = [{ from: 1, val: st.annual }]; }
    else { cfg.mode = 'key'; cfg.mult = 1; }
    const res = E.calcDebts(cfg, App.rates());
    const warnings = res.warnings.slice();
    if (is395) warnings.push.apply(warnings, overlapWarn(st, inp.debts, inp.end));
    const what = is395 ? 'Проценты' : 'Проценты';
    const rateTxt = cfg.mode === 'annual' ? E.fmtRate(st.annual) + '% годовых (по договору)' : 'ключевая ставка Банка России по периодам её действия';
    const blocks = [{ t: 'kv', rows: [['Основание', st.title || '—'], ['Вид процентов', is395 ? 'Проценты за пользование чужими денежными средствами (ст. 395 ГК РФ)' : 'Проценты по денежному обязательству (ст. 317.1 ГК РФ)'], ['Ставка', rateTxt], ['Формула', 'Сумма долга × ставка × дни / дней в году (365 или 366)'], ['Расчёт по дату', inp.end != null ? D(inp.end) + (st.inclusive ? ' (включительно)' : ' (не включая)') : 'по датам долгов'], ['Налог', vatText(st)]] }];
    const exInfo = App.exclFromState(stx);
    if (exInfo.length) blocks.push({ t: 'kv', rows: exInfo.map(x => ['Не начисляется', D(x.from) + ' – ' + D(x.to) + ' — ' + x.label]) });
    blocks.push.apply(blocks, debtBlocks(res, cfg, what));
    blocks.push({ t: 'h', text: 'Итог' }, { t: 'kv', rows: [['Сумма долга (начальная)', M(res.debts.reduce((s, d) => s + (d.amount || 0), 0)) + ' ₽'], ['Проценты', M(res.total) + ' ₽']] });
    warnings.forEach(w => blocks.push({ t: 'note', text: w }));
    const model = { title: is395 ? 'Расчёт процентов по ст. 395 ГК РФ' : 'Расчёт процентов по ст. 317.1 ГК РФ', sub: st.title || '', blocks, footer: asOf() + ' ' + stamp() };
    const chips = ['дней начисления: ' + res.accrDays];
    if (res.exclDays) chips.push('не начисляется: ' + res.exclDays + ' дн.');
    return {
      hero: { label: is395 ? 'Проценты по ст. 395 ГК РФ' : 'Проценты по ст. 317.1 ГК РФ', value: M(res.total) + ' ₽', chips },
      warnings, model, file: (is395 ? 'Проценты_395_' : 'Проценты_317_') + (st.title || '').slice(0, 30),
      save: () => App.saveHistory('int', (st.title || (is395 ? 'Ст. 395' : 'Ст. 317.1')) + ' — ' + M(res.total) + ' ₽', 'по ' + (inp.end != null ? D(inp.end) : '—'), st)
    };
  }

  function buildHist(el) {
    el.innerHTML = '';
    const list = h('div', { class: 'card' });
    const draw = () => {
      list.innerHTML = '';
      const items = App.hist();
      put(list, h('h2', null, 'Сохранённые расчёты', items.length ? h('button', { class: 'btn sm danger', onclick: () => { if (confirm('Удалить всю историю?')) { App.setHist([]); draw(); } } }, 'Очистить') : null));
      if (!items.length) { put(list, h('div', { class: 'empty' }, 'Здесь появятся расчёты, которые вы сохраните кнопкой «Сохранить в историю». Данные хранятся только на этом устройстве.')); return; }
      items.forEach(it => put(list, h('div', { class: 'item' },
        h('div', null, h('div', { class: 't' }, it.title), h('div', { class: 's' }, { pen: 'Неустойка', int: 'Проценты' }[it.kind] + ' · ' + new Date(it.ts).toLocaleString('ru-RU') + ' · ' + it.summary)),
        h('div', { class: 'row' },
          h('button', { class: 'btn sm primary', onclick: () => { App.S[it.kind] = App.clone(it.state); App.save(); App.buildView(it.kind); App.show(it.kind); } }, 'Открыть'),
          h('button', { class: 'btn sm danger', onclick: () => { App.setHist(App.hist().filter(x => x.id !== it.id)); draw(); } }, 'Удалить')))));
    };
    put(el, list);
    draw();
    App.views.hist.refresh = draw;
  }

  /* =============== 5. ДАННЫЕ =============== */
  function buildData(el) {
    el.innerHTML = '';
    const S = App.S, set = S.settings;
    const mk = (title, ...kids) => h('div', { class: 'card' }, h('h2', null, title), ...kids);

    // --- ставки
    const rateBox = h('div'), showAll = { v: false };
    const drawRates = () => {
      rateBox.innerHTML = '';
      const all = App.rates().slice().reverse(), rows = showAll.v ? all : all.slice(0, 8);
      put(rateBox, h('div', { class: 'tw' }, h('table', { class: 'grid' }, h('thead', null, h('tr', null, h('th', null, 'С даты'), h('th', { class: 'r' }, 'Ставка, %'), h('th', null, 'Источник'), h('th', null, ''))),
        h('tbody', null, rows.map(r => h('tr', null, h('td', null, D(r.d)), h('td', { class: 'r' }, E.fmtRate(r.r)), h('td', null, r.src === 'builtin' ? 'встроено' : 'добавлено вами'),
          h('td', null, r.src !== 'builtin' ? h('button', { class: 'btn sm danger', onclick: () => { delete set.userRates[r.iso]; App.resetRates(); App.save(); drawRates(); } }, 'Убрать') : '')))))),
        h('button', { class: 'btn sm', onclick: () => { showAll.v = !showAll.v; drawRates(); } }, showAll.v ? 'Свернуть' : 'Показать все (' + all.length + ')'));
    };
    const newRate = { date: '', rate: null }, paste = { text: '' };
    const pasteInfo = h('div', { class: 'hint' });
    const ta = h('textarea', { placeholder: 'Вставьте строки вида:\n27.07.2026  14,00\n22.06.2026  14,25' });
    ta.addEventListener('input', () => { paste.text = ta.value; const p = E.parseRatesText(ta.value); pasteInfo.textContent = p.length ? 'Распознано строк: ' + p.length : ''; });
    put(el, 
      h('div', { class: 'card' }, h('h2', null, 'Актуальность данных'),
        h('div', null, 'Ключевая ставка: ' + E.fmtRate(E.keyRateOn(App.rates(), E.todayDn())) + '% (проверено ' + D(E.fromISO(DATA.RATES_ASOF)) + ', заседание ЦБ 23.10.2026). Следующее заседание — ' + D(E.fromISO(DATA.NEXT_MEETING)) + '.'),
        h('div', { class: 'hint' }, 'Производственный календарь встроен за ' + DATA.CAL_FROM + '–' + DATA.CAL_TO + ' гг. Для остальных лет применяются стандартные выходные и праздники ст. 112 ТК РФ без переносов.')),
      mk('Ключевая ставка Банка России', rateBox,
        h('details', { class: 'more' }, h('summary', null, 'Добавить новую ставку'),
          h('div', { class: 'grid3' }, field('Действует с', App.dateInput(newRate, 'date')), field('Ставка, % годовых', App.numInput(newRate, 'rate', null, '14')),
            h('div', { style: 'align-self:end' }, h('button', { class: 'btn primary', onclick: () => {
              const iso = newRate.date, r = newRate.rate;
              if (E.fromISO(iso) == null || r == null) { App.toast('Укажите дату и ставку'); return; }
              set.userRates[iso] = r; App.resetRates(); App.save(); drawRates(); App.toast('Ставка добавлена');
            } }, 'Добавить')))),
        h('details', { class: 'more' }, h('summary', null, 'Вставить текстом (таблица с сайта ЦБ)'),
          ta, pasteInfo, h('div', { class: 'hint' }, 'Скопируйте таблицу «Ключевая ставка» с cbr.ru и вставьте сюда. Распознавание скриншотов без интернета недоступно — для этого пришлите изображение в чат Claude, и файл приложения будет обновлён.'),
          h('button', { class: 'btn primary', onclick: () => {
            const p = E.parseRatesText(paste.text).sort((a, b) => (a.iso < b.iso ? -1 : 1));
            let added = 0;
            p.forEach(x => { const cur = E.keyRateOn(App.rates(), E.fromISO(x.iso)); const ex = App.rates().find(r => r.iso === x.iso); if (!ex || ex.r !== x.r) { if (cur !== x.r || !ex) { set.userRates[x.iso] = x.r; App.resetRates(); added++; } } });
            App.save(); drawRates(); App.toast(added ? 'Добавлено ставок: ' + added : 'Новых значений нет');
          } }, 'Применить'))));
    drawRates();

    // --- календарь
    const yrs = { y: Math.min(Math.max(new Date().getFullYear(), DATA.CAL_FROM), DATA.CAL_TO + 1) };
    const calBox = h('div'), bulk = { text: '', kind: 'off' };
    const drawCal = () => {
      calBox.innerHTML = '';
      const cal = App.calendar({ week: 5, covid: S.days.covid });
      const noData = !DATA.CAL[yrs.y];
      const yearSel = h('select', null, [].concat(Array.from({ length: 16 }, (_, i) => 2016 + i)).map(y => h('option', { value: y }, y + (DATA.CAL[y] ? '' : ' (нет данных)'))));
      yearSel.value = yrs.y; yearSel.addEventListener('change', () => { yrs.y = +yearSel.value; drawCal(); });
      const grid = h('div', { class: 'cal' });
      for (let m = 0; m < 12; m++) {
        const first = E.dn(yrs.y, m + 1, 1), dim = new Date(Date.UTC(yrs.y, m + 1, 0)).getUTCDate();
        const g = h('div', { class: 'g' }, ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(x => h('span', { class: 'h' }, x)));
        const lead = (E.dow(first) + 6) % 7; for (let i = 0; i < lead; i++) put(g, h('span'));
        for (let d = 1; d <= dim; d++) {
          const n = first + d - 1, off = cal.isOff(n), wk = E.dow(n), isW = wk === 0 || wk === 6;
          const sp = h('span', { class: off ? 'off' : (isW ? 'wk' : ''), title: cal.kind(n) || 'Рабочий день', style: 'cursor:pointer', onclick: () => {
            const iso = E.toISO(n); const inOff = set.userOff.findIndex(x => x.date === iso), inWork = set.userWork.findIndex(x => x.date === iso);
            if (inOff >= 0) set.userOff.splice(inOff, 1); else if (inWork >= 0) set.userWork.splice(inWork, 1);
            else (off ? set.userWork : set.userOff).push({ date: iso });
            App.save(); drawCal();
          } }, String(d));
          put(g, sp);
        }
        put(grid, h('div', { class: 'mon' }, h('b', null, ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'][m]), g));
      }
      const bulkTa = h('textarea', { placeholder: 'Даты в формате ДД.ММ.ГГГГ — по одной в строке или через запятую' });
      bulkTa.addEventListener('input', () => { bulk.text = bulkTa.value; });
      const own = set.userOff.map(x => ['off', x]).concat(set.userWork.map(x => ['work', x])).sort((a, b) => (a[1].date < b[1].date ? -1 : 1));
      put(calBox, h('div', { class: 'row' }, field('Год', yearSel)),
        noData ? h('div', { class: 'hint-box' }, 'Для ' + yrs.y + ' г. в приложении нет утверждённого календаря: пока применяются стандартные выходные и праздники ст. 112 ТК РФ. Когда Правительство утвердит переносы — отметьте дни ниже.') : null,
        h('div', { class: 'legend' }, h('span', null, h('i', { style: 'background:var(--danger-soft)' }), 'нерабочий день'), h('span', null, h('i', { style: 'box-shadow:inset 0 0 0 1px var(--accent)' }), 'рабочая суббота / воскресенье'), h('span', null, 'Нажмите на день, чтобы изменить его статус.')),
        grid,
        own.length ? h('div', { style: 'margin-top:10px' }, h('div', { class: 'lbl' }, 'Ваши изменения календаря'), own.map(o => h('div', { class: 'item' }, h('span', null, D(E.fromISO(o[1].date)) + ' — ' + (o[0] === 'off' ? 'нерабочий день' : 'рабочий день')), h('button', { class: 'btn sm danger', onclick: () => { const arr = o[0] === 'off' ? set.userOff : set.userWork; arr.splice(arr.indexOf(o[1]), 1); App.save(); drawCal(); } }, 'Убрать')))) : null,
        h('details', { class: 'more' }, h('summary', null, 'Добавить списком (например, переносы из постановления)'),
          bulkTa, field('Что сделать с датами', sel(bulk, 'kind', [['off', 'Сделать нерабочими'], ['work', 'Сделать рабочими']])),
          h('button', { class: 'btn primary', onclick: () => {
            const found = (bulk.text.match(/\d{1,2}\.\d{1,2}\.\d{4}/g) || []).map(E.parseRu).filter(x => x != null);
            found.forEach(n => { const iso = E.toISO(n); set.userOff = set.userOff.filter(x => x.date !== iso); set.userWork = set.userWork.filter(x => x.date !== iso); (bulk.kind === 'off' ? set.userOff : set.userWork).push({ date: iso }); });
            App.save(); drawCal(); App.toast('Дат добавлено: ' + found.length);
          } }, 'Добавить')));
    };
    put(el, mk('Производственный календарь', calBox));
    drawCal();

    // --- мораторий, копия, оформление
    put(el, 
      mk('Мораторные периоды (встроены)', DATA.MORATORIA.map(m => h('div', { class: 'item' }, h('div', null, h('div', { class: 't' }, m.label), h('div', { class: 's' }, D(E.fromISO(m.from)) + ' – ' + D(E.fromISO(m.to)) + '. ' + m.note))))),
      mk('Оформление',
        h('div', { class: 'grid2' }, field('Тема', sel(S, 'theme', [['auto', 'Как в системе'], ['light', 'Светлая'], ['dark', 'Тёмная']], () => { App.applyTheme(); App.save(); })))),
      mk('Резервная копия', h('div', { class: 'hint' }, 'Ставки, правки календаря и история сохраняются на этом устройстве. Скачайте копию, чтобы перенести их на другое.'),
        h('div', { class: 'row', style: 'margin-top:8px' },
          h('button', { class: 'btn', onclick: () => App.download(new Blob([JSON.stringify({ v: 1, settings: App.S.settings, hist: App.hist() })], { type: 'application/json' }), 'raschet-backup-' + E.toISO(E.todayDn()) + '.json') }, 'Скачать копию'),
          h('label', { class: 'btn' }, 'Загрузить копию', h('input', { type: 'file', accept: 'application/json,.json', style: 'display:none', onchange: ev => {
            const f = ev.target.files[0]; if (!f) return;
            f.text().then(t => { try { const o = JSON.parse(t); if (o.settings) { App.S.settings = Object.assign({ userRates: {}, userOff: [], userWork: [] }, o.settings); } if (o.hist) App.setHist(o.hist); App.resetRates(); App.save(); App.buildAll(); App.toast('Копия загружена'); } catch (e) { App.toast('Файл не подошёл'); } });
          } })),
          h('button', { class: 'btn danger', onclick: () => { if (confirm('Удалить все сохранённые данные приложения на этом устройстве?')) { try { localStorage.clear(); } catch (e) { } location.reload(); } } }, 'Стереть все данные'))));
  }

  Object.assign(App, {
    BUILDERS: { days: buildDays, pen: buildPen, int: buildInt, hist: buildHist, data: buildData }
  });
})(window);

/* Запуск: вкладки, тема, офлайн-режим */
(function (root) {
  'use strict';
  const App = root.App, h = App.h;
  const ICON = {
    days: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
    pen: '<svg viewBox="0 0 24 24"><path d="M12 3v18M5 7l-2 6a3 3 0 0 0 4 0L5 7zm14 0-2 6a3 3 0 0 0 4 0l-2-6zM5 7h14M8 21h8"/></svg>',
    int: '<svg viewBox="0 0 24 24"><path d="M5 19 19 5"/><circle cx="7" cy="7" r="2.4"/><circle cx="17" cy="17" r="2.4"/></svg>',
    hist: '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4M12 8v4l3 2"/></svg>',
    data: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>'
  };
  const TABS = [['days', 'Сроки'], ['pen', 'Неустойка'], ['int', 'Ст. 395'], ['hist', 'История'], ['data', 'Данные']];

  App.applyTheme = function () {
    const t = App.S.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  };
  App.buildView = function (k) {
    const el = document.getElementById('v-' + k);
    App.views[k] = { el, refresh: null };
    App.BUILDERS[k](el);
  };
  App.buildAll = function () { TABS.forEach(t => App.buildView(t[0])); };
  App.show = function (k) {
    App.S.tab = k; App.save();
    TABS.forEach(t => {
      document.getElementById('v-' + t[0]).classList.toggle('on', t[0] === k);
      const b = document.querySelector('nav.tabs button[data-t="' + t[0] + '"]'); if (b) b.classList.toggle('on', t[0] === k);
    });
    window.scrollTo(0, 0);
  };

  function init() {
    App.load(); App.applyTheme();
    const nav = document.querySelector('nav.tabs .inner');
    TABS.forEach(t => nav.append(h('button', { 'data-t': t[0], html: ICON[t[0]] + '<span>' + t[1] + '</span>', onclick: () => App.show(t[0]) })));
    document.getElementById('themeBtn').addEventListener('click', () => {
      const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (App.S.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      App.S.theme = dark ? 'light' : 'dark'; App.applyTheme(); App.save();
    });
    window.addEventListener('pagehide', App.flush);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') App.flush(); });
    App.buildAll();
    App.show(TABS.some(t => t[0] === App.S.tab) ? App.S.tab : 'days');
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})(window);
</script>
